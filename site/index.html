<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Für dich ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff1f2; --bg2: #ffe4e6; --card: #ffffffcc; --text: #4a2c35;
    --muted: #8c6470; --accent: #e11d48; --accent-hover: #be123c; --err: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif; color: var(--text);
    background: radial-gradient(circle at 20% 10%, var(--bg2), var(--bg1) 60%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; overflow-x: hidden;
  }
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .hearts span {
    position: absolute; bottom: -40px; color: var(--accent); opacity: .25;
    animation: rise linear infinite;
  }
  @keyframes rise { to { transform: translateY(-115vh) rotate(25deg); } }
  @media (prefers-reduced-motion: reduce) { .hearts { display: none; } }
  .card {
    position: relative; z-index: 1; width: 100%; max-width: 440px; text-align: center;
    background: var(--card); backdrop-filter: blur(6px); border-radius: 24px;
    padding: 40px 28px; box-shadow: 0 20px 60px -20px #e11d4855;
  }
  .card.wide { max-width: 960px; padding: 28px 20px; }
  h1 { font-family: "Dancing Script", cursive; font-size: 2.6rem; margin: 0 0 8px; color: var(--accent); line-height: 1.15; }
  p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    font: inherit; padding: 14px 16px; border-radius: 14px; border: 2px solid #fecdd3;
    background: #fff; color: var(--text); text-align: center; font-size: 1.05rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; padding: 14px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; cursor: pointer; font-size: 1.05rem;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.4em; margin-top: 10px; font-size: .95rem; }
  .msg.err { color: var(--err); }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  video { width: 100%; border-radius: 16px; background: #000; display: block; margin-top: 8px; }
  .letter { white-space: pre-wrap; color: var(--text); font-size: 1.05rem; margin: 20px auto 0; max-width: 680px; text-align: left; line-height: 1.6; }
  /* Feuer-&-Eis-Herzen hinter dem Video */
  #heartbg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease; }
  body.night #heartbg { opacity: 1; }
  body.night { background: #05040b; }
  body.night .hearts { display: none; }
  body.night .card { background: rgba(20, 14, 30, .55); box-shadow: 0 20px 60px -20px #c93cff55; }
  body.night h1 { color: #f5b8ff; }
  body.night .letter { color: #ece4ff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="hearts" aria-hidden="true"></div>
<canvas id="heartbg" aria-hidden="true"></canvas>

<main class="card" id="lock">
  <h1>Für dich ♥</h1>
  <p>Hier wartet eine kleine Überraschung.<br>Gib das Passwort ein, um sie zu öffnen.</p>
  <form id="form" autocomplete="off">
    <input id="pw" type="password" placeholder="Passwort" aria-label="Passwort" required autofocus>
    <button id="btn" type="submit">Öffnen</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
</main>

<main class="card wide hidden" id="content">
  <h1 id="title"></h1>
  <video id="video" controls playsinline></video>
  <div class="letter" id="letter"></div>
</main>

<script>
// Feuer & Eis: kleine Hintergrund-Herzen (glimmende Asche steigt, Eis-Herzen fallen)
function startHeartBg(cv) {
  const ctx = cv.getContext('2d');
  let W, H, S, bg = [], last = 0, running = false;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const heartPt = t => [Math.pow(Math.sin(t), 3),
    -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16 - 0.155];
  const UNIT = new Path2D();
  for (let i = 0; i < 40; i++) { const [x, y] = heartPt(i / 40 * Math.PI * 2); i ? UNIT.lineTo(x, y) : UNIT.moveTo(x, y); }
  UNIT.closePath();

  // Leucht-Sprites: 0 = Feuer … 1 = Eis
  const STOPS = [[0,'#fff3b0'],[0.12,'#ffb21f'],[0.25,'#ff5a12'],[0.38,'#ff1e3c'],[0.5,'#c93cff'],
                 [0.62,'#6c5cff'],[0.75,'#2ea6ff'],[0.88,'#80eaff'],[1,'#f2fdff']];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const pal = t => {
    for (let i = 1; i < STOPS.length; i++) if (t <= STOPS[i][0]) {
      const [t0, c0] = STOPS[i - 1], [t1, c1] = STOPS[i], k = (t - t0) / (t1 - t0), a = hex(c0), b = hex(c1);
      return a.map((v, j) => Math.round(v + (b[j] - v) * k));
    }
    return hex(STOPS[STOPS.length - 1][1]);
  };
  const NS = 64, SPR = [];
  for (let i = 0; i < NS; i++) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), [r, gg, b] = pal(i / (NS - 1));
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${(r + 255) >> 1},${(gg + 255) >> 1},${(b + 255) >> 1},1)`);
    gr.addColorStop(0.1, `rgba(${r},${gg},${b},1)`);
    gr.addColorStop(0.35, `rgba(${r},${gg},${b},.45)`);
    gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); SPR.push(c);
  }
  const spr = t => SPR[Math.round(clamp(t) * (NS - 1))];

  function newBg(ash, anywhere) {
    const d = rand(0.35, 1), u = S / 420, r = (3 + 7 * d) * u;
    return { ash, d, r, ph: rand(0, 6.28), rot: rand(-0.6, 0.6), vr: rand(-0.8, 0.8),
      x: rand(-20, W + 20), y: anywhere ? rand(0, H) : (ash ? H + r * 3 : -r * 3),
      vy: (ash ? -rand(14, 34) : rand(18, 42)) * u * (0.5 + 0.6 * d), sw: rand(10, 28) * u, hue: rand(0, 1) };
  }
  function resize() {
    const DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.max(300, Math.min(W, H * 0.9));
    const n = Math.round(clamp(W * H / 9000, 26, 90));
    bg = []; for (let i = 0; i < n; i++) bg.push(newBg(i % 2 === 0, true));
  }
  function draw(dt) {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#05040b'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < bg.length; i++) {
      const q = bg[i];
      q.y += q.vy * dt; q.ph += dt * (q.ash ? 1.6 : 0.9); q.rot += q.vr * dt * (q.ash ? 1.4 : 0.6);
      const x = q.x + Math.sin(q.ph) * q.sw * (q.ash ? 1.2 : 1);
      if (q.ash ? q.y < -q.r * 4 : q.y > H + q.r * 4) { bg[i] = newBg(q.ash, false); continue; }
      let a, col, glow;
      if (q.ash) {   // glimmende Asche: flackert, wird nach oben hin dunkler
        const fl = 0.55 + 0.45 * Math.sin(q.ph * 3.3 + q.hue * 9) ** 2, fade = clamp(q.y / H * 1.3);
        a = (0.25 + 0.55 * q.d) * fl * (0.35 + 0.65 * fade);
        col = `rgb(${Math.round(200 + 55 * q.hue)},${Math.round(25 + 45 * fl * q.hue)},${Math.round(30 + 20 * q.hue)})`;
        glow = spr(0.22 + 0.14 * q.hue);
      } else {       // fallende Eis-Herzen: kühl, sanft funkelnd
        a = (0.25 + 0.55 * q.d) * (0.7 + 0.3 * Math.sin(q.ph * 2.1 + q.hue * 7));
        col = `rgb(${Math.round(50 + 70 * q.hue)},${Math.round(140 + 70 * q.hue)},255)`;
        glow = spr(0.72 + 0.16 * q.hue);
      }
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * 0.5;
      ctx.drawImage(glow, x - q.r * 2.2, q.y - q.r * 2.2, q.r * 4.4, q.r * 4.4);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a;
      ctx.save(); ctx.translate(x, q.y); ctx.rotate(q.rot); ctx.scale(q.r, q.r);
      ctx.fillStyle = col; ctx.fill(UNIT);
      if (!q.ash) { ctx.lineWidth = 0.12; ctx.strokeStyle = 'rgba(200,240,255,.7)'; ctx.stroke(UNIT); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    if (!running) return;
    draw(Math.min(0.05, (now - last) / 1000)); last = now;
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { resize(); if (still || !running) draw(0); });
  resize(); draw(0);
  return {
    start() { if (running || still) return; running = true; last = performance.now(); requestAnimationFrame(frame); },
    stop() { running = false; }
  };
}

// Datei, die mit verschluesseln.html erzeugt wurde.
const ENCRYPTED_FILE = "video.enc";
const ITERATIONS = 2000000;

// Herzen im Hintergrund
(() => {
  const box = document.querySelector(".hearts");
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("span");
    s.textContent = "♥";
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 12 + Math.random() * 26 + "px";
    s.style.animationDuration = 9 + Math.random() * 12 + "s";
    s.style.animationDelay = -Math.random() * 20 + "s";
    box.appendChild(s);
  }
})();

const $ = (id) => document.getElementById(id);
let encrypted = null;

async function loadEncrypted(onProgress) {
  if (encrypted) return encrypted;
  const res = await fetch(ENCRYPTED_FILE, { cache: "force-cache" });
  if (!res.ok) throw new Error("Datei nicht gefunden");
  const total = +res.headers.get("Content-Length") || 0;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (total) onProgress(Math.round(got / total * 100));
  }
  const buf = new Uint8Array(got); let o = 0;
  for (const c of chunks) { buf.set(c, o); o += c.length; }
  return (encrypted = buf);
}

async function decrypt(buf, password) {
  // Format: "BDAY1"(5) | salt(16) | iv(12) | AES-GCM-Ciphertext
  const magic = new TextDecoder().decode(buf.slice(0, 5));
  if (magic !== "BDAY1") throw new Error("Unbekanntes Format");
  const salt = buf.slice(5, 21), iv = buf.slice(21, 33), data = buf.subarray(33);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data));
  // Inhalt: Länge(4, big endian) | JSON-Metadaten | Videodaten
  const len = new DataView(plain.buffer).getUint32(0);
  const meta = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + len)));
  const video = new Blob([plain.subarray(4 + len)], { type: meta.mime || "video/mp4" });
  return { meta, video };
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btn"), msg = $("msg");
  btn.disabled = true; msg.className = "msg"; msg.textContent = "Lädt …";
  try {
    const buf = await loadEncrypted((p) => (msg.textContent = `Lädt … ${p} %`));
    msg.textContent = "Wird geöffnet …";
    let result;
    try { result = await decrypt(buf, $("pw").value); }
    catch { throw new Error("pw"); }
    const { meta, video } = result;
    $("title").textContent = meta.title || "Alles Liebe zum Geburtstag!";
    $("letter").textContent = meta.message || "";
    $("letter").classList.toggle("hidden", !meta.message);
    $("video").src = URL.createObjectURL(video);
    $("lock").classList.add("hidden");
    $("content").classList.remove("hidden");
    document.title = meta.title || "Alles Liebe ♥";
    try {
      const hb = startHeartBg($("heartbg"));
      document.body.classList.add("night");
      hb.start();
    } catch (e) { /* Hintergrund ist nur Deko, Video läuft trotzdem */ }
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = err.message === "pw" ? "Das Passwort stimmt leider nicht." : "Etwas ist schiefgelaufen: " + err.message;
    $("lock").classList.remove("shake"); void $("lock").offsetWidth; $("lock").classList.add("shake");
    btn.disabled = false;
  }
});
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video verschlüsseln</title>
<style>
  :root { --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b; --accent: #e11d48; --border: #e2e8f0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 32px 16px; }
  main { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  h1 { margin: 0 0 6px; font-size: 1.4rem; }
  p.note { color: var(--muted); margin: 0 0 22px; line-height: 1.5; font-size: .95rem; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: .95rem; }
  input, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
  textarea { min-height: 120px; resize: vertical; }
  button { margin-top: 22px; width: 100%; font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #status { margin-top: 14px; color: var(--muted); min-height: 1.4em; }
  .warn { color: #b45309; }
</style>
</head>
<body>
<main>
  <h1>Video verschlüsseln</h1>
  <p class="note">Läuft komplett in deinem Browser, nichts wird hochgeladen. Ergebnis ist die Datei <b>video.enc</b>, die neben <b>index.html</b> ins Repository kommt. Titel und Nachricht werden mitverschlüsselt.</p>

  <label for="file">Video (am besten MP4, unter 100 MB)</label>
  <input id="file" type="file" accept="video/*">

  <label for="title">Überschrift nach dem Öffnen</label>
  <input id="title" value="Alles Liebe zum Geburtstag! ♥">

  <label for="message">Persönliche Nachricht unter dem Video (optional)</label>
  <textarea id="message" placeholder="Meine Liebe, …"></textarea>

  <label for="pw">Passwort</label>
  <input id="pw" type="text" placeholder="z. B. euer Jahrestag">

  <button id="go">Verschlüsseln und herunterladen</button>
  <div id="status"></div>
</main>
<script>
const ITERATIONS = 2000000;
const $ = (id) => document.getElementById(id);

$("go").addEventListener("click", async () => {
  const file = $("file").files[0], pw = $("pw").value, st = $("status");
  st.className = "";
  if (!file) return (st.textContent = "Bitte ein Video auswählen.");
  if (pw.length < 4) return (st.textContent = "Bitte ein Passwort mit mindestens 4 Zeichen wählen.");
  $("go").disabled = true; st.textContent = "Verschlüssele …";
  try {
    const meta = new TextEncoder().encode(JSON.stringify({
      title: $("title").value, message: $("message").value, mime: file.type || "video/mp4"
    }));
    const video = new Uint8Array(await file.arrayBuffer());
    const plain = new Uint8Array(4 + meta.length + video.length);
    new DataView(plain.buffer).setUint32(0, meta.length);
    plain.set(meta, 4); plain.set(video, 4 + meta.length);

    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plain));

    const out = new Blob([new TextEncoder().encode("BDAY1"), salt, iv, ct], { type: "application/octet-stream" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(out); a.download = "video.enc"; a.click();
    const mb = (out.size / 1048576).toFixed(1);
    st.textContent = `Fertig: video.enc (${mb} MB) wurde heruntergeladen.`;
    if (out.size > 100 * 1048576) { st.className = "warn"; st.textContent += " Achtung: über 100 MB, GitHub nimmt die Datei so nicht an. Video bitte stärker komprimieren."; }
  } catch (e) {
    st.textContent = "Fehler: " + e.message;
  } finally { $("go").disabled = false; }
});
</script>
</body>
</html>
